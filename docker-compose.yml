version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///notes.db}
    volumes:
      - sqlite_data:/app/instance
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notesuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notespass}
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sqlite_data:
  postgres_data:
